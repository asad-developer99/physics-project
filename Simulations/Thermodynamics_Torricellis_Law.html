<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Pressure and Fluid Speed with Depth | 3D Simulation</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg1:#e9f1f7;--bg2:#cfdeea;--panel:rgba(255,255,255,.9);--ink:#14213d;--mute:#56607a;--line:#c7d1de;--a:#0b7a9b;--b:#d9480f;--ok:#177245}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:linear-gradient(var(--bg1),var(--bg2));color:var(--ink);font:400 14px/1.45 Figtree,system-ui,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;align-items:center;gap:12px;padding:12px 16px;pointer-events:none}
header h1{font:800 20px 'Bricolage Grotesque',sans-serif;margin:0;letter-spacing:-.01em}
header small{color:var(--mute)}
header button{margin-left:auto;pointer-events:auto}
.panel{position:fixed;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
#ctl{top:calc(56px + env(safe-area-inset-top,0px));left:14px;width:320px;max-height:calc(100% - 80px);overflow:auto}
#out{top:calc(56px + env(safe-area-inset-top,0px));right:14px;width:290px}
h2{font:700 15px 'Bricolage Grotesque',sans-serif;margin:0 0 8px}
.sl{display:grid;grid-template-columns:1fr auto;gap:0 8px;margin-bottom:9px}
.sl label{font-weight:500}.sl output{font-variant-numeric:tabular-nums;color:var(--a);font-weight:600}
.sl input{grid-column:1/-1;width:100%;accent-color:var(--a)}
button{font:600 13px Figtree,sans-serif;color:var(--ink);background:none;border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--a)}button:focus-visible,input:focus-visible{outline:2px solid var(--a);outline-offset:2px}
button.on{background:var(--a);border-color:var(--a);color:#fff}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg button{flex:1}
.row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)}
.row b{font-variant-numeric:tabular-nums}
.big{font:800 30px 'Bricolage Grotesque',sans-serif;color:var(--b);line-height:1.1}
.eq{font:500 13px ui-monospace,Menlo,monospace;color:var(--mute);margin:6px 0}
#note{color:var(--ok);font-weight:500;margin-top:8px}
canvas#gr{width:100%;height:96px;display:block;margin-top:8px}
select{font:500 13px Figtree,sans-serif;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:100%}
.sl select{grid-column:1/-1}
@media(max-width:820px){#ctl{width:calc(100% - 28px);top:auto;bottom:10px;max-height:44%}#out{top:calc(50px + env(safe-area-inset-top,0px));width:210px;font-size:12px;padding:10px}.big{font-size:22px}#gr{display:none}header small{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<header><h1>Pressure and Fluid Speed with Depth</h1><small>Drag to rotate, scroll to zoom</small></header>

<div class="panel" id="ctl">
<div class="seg"><button id="m1" class="on">Single nozzle</button><button id="m2">Torricelli's law</button></div>
<div class="sl"><label for="H">Fluid height, H</label><output id="Ho"></output><input type="range" id="H" min="10" max="100" step="1" value="40"></div>
<div class="sl" id="hrow"><label for="h">Nozzle height, h</label><output id="ho"></output><input type="range" id="h" min="1" max="38" step="1" value="20"></div>
<div class="sl"><label for="R">Tank radius, R</label><output id="Ro"></output><input type="range" id="R" min="5" max="25" step="1" value="10"></div>
<div class="sl"><label for="r">Nozzle radius, r</label><output id="ro"></output><input type="range" id="r" min="0.1" max="2" step="0.1" value="0.5"></div>
<div class="sl"><label for="p">Pressure probe depth, d</label><output id="po"></output><input type="range" id="p" min="0" max="40" step="0.5" value="10"></div>
<div class="sl"><label for="g">Gravity, g</label><output id="go"></output><input type="range" id="g" min="1.6" max="25" step="0.01" value="9.81"></div>
<div class="sl"><label for="fl">Fluid</label><select id="fl"><option value="1000">Water (1000 kg/m³)</option><option value="1025">Seawater (1025 kg/m³)</option><option value="800">Oil (800 kg/m³)</option><option value="13534">Mercury (13534 kg/m³)</option></select></div>
<div class="sl"><label for="s">Playback speed</label><output id="so"></output><input type="range" id="s" min="0.1" max="1" step="0.05" value="0.35"></div>
<div class="seg" style="margin:4px 0 0"><button id="pz">Pause</button><button id="rs">Reset</button></div>
</div>

<div class="panel" id="out">
<h2>Fluid speed</h2>
<div class="big"><span id="v">0</span> m/s</div>
<div class="eq">v = √(2g(H − h))</div>
<div class="row"><span>Depth of nozzle</span><b id="dep"></b></div>
<div class="row"><span>Horizontal range</span><b id="rng"></b></div>
<div class="row"><span>Time of flight</span><b id="tof"></b></div>
<div class="row"><span>Flow rate</span><b id="q"></b></div>
<div id="note"></div>
<h2 style="margin-top:14px">Pressure at probe</h2>
<div class="eq">P = P₀ + ρ g d</div>
<div class="row"><span>Fluid density</span><b id="rh"></b></div>
<div class="row"><span>Gauge</span><b id="pg"></b></div>
<div class="row"><span>Absolute (atm)</span><b id="pa"></b></div>
<div class="row"><span>Absolute (Pa)</span><b id="pt"></b></div>
<canvas id="gr" aria-label="Graph of pressure against depth"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
let g=9.81,rho=1000;const P0=101325;
const D={H:40,h:20,R:10,r:0.5,p:10,s:0.35,g:9.81,mode:1,paused:false};
const FLUID_COL={1000:0x2aa8d8,1025:0x1f8fc4,800:0xd9a21b,13534:0xaab4c0};
const $=i=>document.getElementById(i);
const root=document.documentElement;

// ---------- scene ----------
const cv=$('c'),ren=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
ren.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,1,.1,2000);
cam.position.set(60,38,95);
const oc=new THREE.OrbitControls(cam,cv);oc.enableDamping=true;oc.target.set(14,18,0);oc.maxPolarAngle=Math.PI*.495;
scene.add(new THREE.AmbientLight(0xffffff,.7));
const sun=new THREE.DirectionalLight(0xffffff,.8);sun.position.set(-40,80,50);scene.add(sun);
const grid=new THREE.GridHelper(300,60,0x6a86a8,0x8aa3c0);grid.material.transparent=true;grid.material.opacity=.35;scene.add(grid);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0x7d97b5,transparent:true,opacity:.12}));ground.position.y=-.02;scene.add(ground);

const tank=new THREE.Group();scene.add(tank);
const glassM=new THREE.MeshPhongMaterial({color:0xcfe8f5,transparent:true,opacity:.18,side:THREE.DoubleSide,depthWrite:false});
const waterM=new THREE.MeshPhongMaterial({color:0x2aa8d8,transparent:true,opacity:.5,shininess:80});
const steelM=new THREE.MeshPhongMaterial({color:0x5b6678});
const probeM=new THREE.MeshBasicMaterial({color:0xe03131});
const probe=new THREE.Mesh(new THREE.SphereGeometry(.9,24,16),probeM);scene.add(probe);
const pline=new THREE.Line(new THREE.BufferGeometry(),new THREE.LineDashedMaterial({color:0xe03131,dashSize:.8,gapSize:.5}));scene.add(pline);
const rangeMk=new THREE.Group();scene.add(rangeMk);
let jets=[];

function clear(o){while(o.children.length){const c=o.children[0];o.remove(c);if(c.geometry)c.geometry.dispose()}}
function heights(){return D.mode===1?[D.h]:[1,2,3,4,5,6].map(k=>D.H*k/7)}
function build(){
  clear(tank);const{H,R}=D;
  const wall=new THREE.Mesh(new THREE.CylinderGeometry(R+.15,R+.15,H+4,56,1,true),glassM);wall.position.set(0,(H+4)/2,0);tank.add(wall);
  const water=new THREE.Mesh(new THREE.CylinderGeometry(R,R,H,56),waterM);water.position.set(0,H/2,0);tank.add(water);
  const base=new THREE.Mesh(new THREE.CylinderGeometry(R+1,R+1.4,1.5,56),steelM);base.position.y=-.75;tank.add(base);
  // depth scale ticks on the wall
  const step=H>60?10:5;
  for(let y=0;y<=H;y+=step){const t=new THREE.Mesh(new THREE.BoxGeometry(1.4,.12,.12),new THREE.MeshBasicMaterial({color:y%(step*2)?0x889ab3:0x2a3b57}));t.position.set(-R-.8,y,0);tank.add(t)}
  jets.forEach(j=>{scene.remove(j.pts);scene.remove(j.line);j.pts.geometry.dispose();j.line.geometry.dispose()});jets=[];
  clear(rangeMk);
  const hs=heights(),best=hs.reduce((a,b)=>Math.abs(b-H/2)<Math.abs(a-H/2)?b:a);
  hs.forEach(h=>{
    const v=Math.sqrt(2*g*(H-h)),T=Math.sqrt(2*h/g),N=D.mode===1?60:36;
    const col=D.mode===2&&h===best?0xff7a1a:0x1c7ed6;
    const pts=new THREE.Points(new THREE.BufferGeometry().setAttribute('position',new THREE.BufferAttribute(new Float32Array(N*3),3)),new THREE.PointsMaterial({color:col,size:D.mode===1?Math.max(.7,D.r*1.6):.9,transparent:true,opacity:.9,sizeAttenuation:true}));
    pts.frustumCulled=false;scene.add(pts);
    const cp=[];for(let i=0;i<=40;i++){const t=T*i/40;cp.push(new THREE.Vector3(R+v*t,h-.5*g*t*t,0))}
    const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(cp),new THREE.LineBasicMaterial({color:col,transparent:true,opacity:.45}));scene.add(line);
    jets.push({h,v,T,N,pts,line});
    // nozzle + range marker
    const nz=new THREE.Mesh(new THREE.CylinderGeometry(Math.max(D.r,.3)+.25,Math.max(D.r,.3)+.25,1.6,20).rotateZ(Math.PI/2),steelM);nz.position.set(R+.2,h,0);rangeMk.add(nz);
    const mk=new THREE.Mesh(new THREE.RingGeometry(.6,1.1,32).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:col,side:THREE.DoubleSide}));mk.position.set(R+v*T,.05,0);rangeMk.add(mk);
  });
  setProbe();
}
function setProbe(){
  const y=D.H-D.p;probe.position.set(0,y,0);
  pline.geometry.setFromPoints([new THREE.Vector3(0,D.H,0),new THREE.Vector3(0,y,0)]);pline.computeLineDistances();
}

// ---------- readouts ----------
const f=(x,n=2)=>x.toFixed(n);
function readouts(){
  const{H,h,r,p}=D;const j=D.mode===1?jets[0]:null;
  if(j){const rng=j.v*j.T;$('v').textContent=f(j.v);$('dep').textContent=f(H-h,1)+' m';$('rng').textContent=f(rng)+' m';$('tof').textContent=f(j.T)+' s';$('q').textContent=f(Math.PI*r*r*j.v,2)+' m³/s';
    $('note').textContent=Math.abs(h-H/2)<.5?'Nozzle is at mid-height, so the range is the largest possible.':'The range is greatest at h = H/2.'}
  else{$('v').textContent='0 to '+f(Math.sqrt(2*g*H*6/7),1);$('dep').textContent='H/7 steps';$('rng').textContent='max '+f(H,1)+' m';$('tof').textContent='varies';$('q').textContent='varies';
    $('note').textContent='Deeper jets leave faster, but the orange jet at mid-height lands farthest (range = H).'}
  $('rh').textContent=rho.toLocaleString()+' kg/m³';const gp=rho*g*p;$('pg').textContent=f(gp/1000)+' kPa';$('pa').textContent=f((gp+P0)/P0)+' atm';$('pt').textContent=Math.round(gp+P0).toLocaleString()+' Pa';
  graph();
}
function graph(){
  const c=$('gr'),w=c.width=c.clientWidth*2||400,hh=c.height=192,x=c.getContext('2d');if(!c.clientWidth)return;
  const cs=getComputedStyle(root),ink=cs.getPropertyValue('--mute').trim(),a=cs.getPropertyValue('--a').trim(),b=cs.getPropertyValue('--b').trim();
  x.clearRect(0,0,w,hh);const m=10,pm=P0+rho*g*D.H;
  const X=d=>m+d/D.H*(w-2*m),Y=P=>hh-m-(P-P0)/(pm-P0)*(hh-2*m-10);
  x.strokeStyle=ink;x.globalAlpha=.4;x.lineWidth=2;x.beginPath();x.moveTo(m,hh-m);x.lineTo(w-m,hh-m);x.stroke();x.globalAlpha=1;
  x.strokeStyle=a;x.lineWidth=4;x.beginPath();x.moveTo(X(0),Y(P0));x.lineTo(X(D.H),Y(pm));x.stroke();
  const pp=P0+rho*g*D.p;x.fillStyle=b;x.beginPath();x.arc(X(D.p),Y(pp),9,0,7);x.fill();
  x.fillStyle=ink;x.font='22px Figtree,sans-serif';x.fillText('P vs depth',m,22);
}

// ---------- inputs ----------
const S={H:'H',h:'h',R:'R',r:'r',p:'p',g:'g',s:'s'},unit={H:' m',h:' m',R:' m',r:' m',p:' m',g:' m/s²',s:'×'};
function sync(){
  $('h').max=D.H-2;if(D.h>D.H-2)D.h=D.H-2;$('h').value=D.h;
  $('p').max=D.H;if(D.p>D.H)D.p=D.H;$('p').value=D.p;$('g').value=D.g;
  for(const k in S)$(k+'o').textContent=(k==='r'?D[k].toFixed(1):k==='s'||k==='g'?D[k].toFixed(2):D[k])+unit[k];
}
for(const k in S)$(k).addEventListener('input',e=>{D[k]=+e.target.value;if(k==='g')g=D.g;sync();if(k==='p'){setProbe()}else if(k!=='s'){build()}readouts()});
function mode(m){D.mode=m;$('m1').classList.toggle('on',m===1);$('m2').classList.toggle('on',m===2);$('hrow').style.opacity=m===1?1:.4;$('h').disabled=m!==1;build();readouts()}
$('fl').addEventListener('change',e=>{rho=+e.target.value;waterM.color.setHex(FLUID_COL[rho]);readouts()});
$('m1').onclick=()=>mode(1);$('m2').onclick=()=>mode(2);
$('pz').onclick=()=>{D.paused=!D.paused;$('pz').textContent=D.paused?'Play':'Pause'};
$('rs').onclick=()=>{Object.assign(D,{H:40,h:20,R:10,r:.5,p:10,s:.35,g:9.81});g=9.81;rho=1000;$('fl').value='1000';waterM.color.setHex(FLUID_COL[1000]);D.paused=false;$('pz').textContent='Pause';sync();mode(1);oc.target.set(14,18,0);cam.position.set(60,38,95)};

// ---------- loop ----------
let tt=0,last=performance.now();
function resize(){const w=innerWidth,h=innerHeight;ren.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();readouts()}
addEventListener('resize',resize);
const mq=matchMedia('(prefers-reduced-motion:reduce)');
function loop(now){
  requestAnimationFrame(loop);const dt=(now-last)/1000;last=now;
  if(!D.paused)tt+=dt*D.s;
  jets.forEach(j=>{const a=j.pts.geometry.attributes.position;
    for(let i=0;i<j.N;i++){const t=((tt/ j.T*1.0+i/j.N)%1)*j.T;a.setXYZ(i,D.R+j.v*t,j.h-.5*g*t*t,0)}a.needsUpdate=true});
  oc.update();ren.render(scene,cam);
}
sync();build();resize();readouts();
if(mq.matches){D.paused=true;$('pz').textContent='Play'}
requestAnimationFrame(loop);
</script>
    <button id="theorybutton" onClick="theorySite()" style="position:fixed;bottom:10px;left:10px;z-index:1000;cursor:pointer;">THEORY</button>
    <script>
        function theorySite() {

            window.open("../Theory/topic-2-5.html", "_self")
        }
    </script>
    <button id="simlsbutton" onClick="simlsSite()" style="position:fixed;bottom:10px;left:100px;z-index:1000;cursor:pointer;">RETURN TO SIMLS</button>
    <script>
        function simlsSite() {

            window.open("../simls.html", "_self")
        }
    </script>
</body>
</html>
